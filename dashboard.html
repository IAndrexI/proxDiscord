<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiscordRPC | Protutech Cloud</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png">
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: rgba(22, 27, 38, 0.82);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(30, 37, 52, 0.95);
      --text: #f2f3f5;
      --text-muted: #949ba4;
      --accent: #5865f2;
      --accent-glow: rgba(88, 101, 242, 0.35);
      --green: #23a55a;
      --green-glow: rgba(35, 165, 90, 0.35);
      --amber: #f0b232;
      --red: #f23f43;
      --purple: #9b59b6;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 15% 15%, #141a29 0%, #0b0e14 70%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1380px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 24px;
      position: relative;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pulse-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(35, 165, 90, 0.12);
      border: 1px solid rgba(35, 165, 90, 0.3);
      color: var(--green);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* User Switcher Dropdown */
    .user-select-wrapper {
      position: relative;
    }

    .user-select-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .user-select-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .user-avatar-sm {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    .status-dot-sm {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot-sm.online {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .status-dot-sm.offline {
      background: var(--text-muted);
    }

    .dropdown-arrow {
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .user-dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 280px;
      background: rgba(18, 23, 33, 0.96);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 1000;
    }

    .user-dropdown-menu.show {
      display: flex;
    }

    .user-dropdown-search {
      padding: 10px 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .user-dropdown-search input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 0.8rem;
      outline: none;
    }

    .user-dropdown-search input:focus {
      border-color: var(--accent);
    }

    .user-dropdown-list {
      max-height: 220px;
      overflow-y: auto;
      padding: 4px 0;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .user-item:hover, .user-item.active {
      background: rgba(88, 101, 242, 0.15);
    }

    .user-item-info {
      flex: 1;
      min-width: 0;
    }

    .user-item-name {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-item-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-dropdown-footer {
      padding: 8px 12px;
      border-top: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.2);
    }

    .directory-view-btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .directory-view-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border-color: var(--accent);
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* Active Discord Banner */
    .discord-banner {
      background: linear-gradient(90deg, rgba(88, 101, 242, 0.15) 0%, rgba(35, 165, 90, 0.15) 100%);
      border: 1px solid rgba(88, 101, 242, 0.3);
      border-radius: var(--radius);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 16px;
    }

    .discord-now {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .discord-pill {
      background: var(--accent);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .discord-details {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .discord-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Mini Screens Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .card.active-screen {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .card.active-screen::before {
      content: "LIVE ON DISCORD";
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--accent);
      color: white;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .card-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .card-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 1px;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .primary-metric {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    .secondary-state {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #23a55a, #5865f2);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .chips-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .chip.highlight {
      background: rgba(88, 101, 242, 0.15);
      border-color: rgba(88, 101, 242, 0.35);
      color: #b5c2f8;
    }

    .chip.green {
      background: rgba(35, 165, 90, 0.15);
      border-color: rgba(35, 165, 90, 0.35);
      color: #57f287;
    }

    /* Free Games Card Styling */
    .free-game-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }

    .free-game-item:hover {
      background: rgba(88, 101, 242, 0.15);
      border-color: rgba(88, 101, 242, 0.4);
      transform: translateX(2px);
    }

    .free-game-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .free-game-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .free-badge {
      background: rgba(35, 165, 90, 0.2);
      border: 1px solid rgba(35, 165, 90, 0.4);
      color: #57f287;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .worth-strike {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .platform-tag {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #b5c2f8;
      font-weight: 500;
    }

    /* Community Directory Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 9999;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      padding: 24px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close-btn:hover {
      color: var(--text);
    }

    .directory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      overflow-y: auto;
      margin-top: 14px;
      padding-right: 4px;
    }

    .user-card-sm {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }

    .user-card-sm:hover {
      background: rgba(88, 101, 242, 0.15);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .user-card-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--card-border);
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      padding: 16px;
      border-top: 1px solid var(--card-border);
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      header { flex-direction: column; align-items: flex-start; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Navigation Bar -->
  <header>
    <div class="brand">
      <img src="https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png" alt="Proxmox" class="brand-icon">
      <div>
        <div class="brand-title">
          DiscordRPC
          <span class="pulse-pill"><span class="pulse-dot"></span> LIVE SYNC</span>
        </div>
        <div class="brand-subtitle">Protutech Cloud • Multi-User System Hub</div>
      </div>
    </div>
    <div class="header-actions">
      <!-- User Switcher Dropdown -->
      <div class="user-select-wrapper">
        <button class="user-select-btn" onclick="toggleUserDropdown()" id="user-dropdown-btn">
          <img id="header-user-avatar" src="https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png" class="user-avatar-sm" alt="Avatar">
          <span id="header-user-name">Loading...</span>
          <span class="status-dot-sm online" id="header-user-dot"></span>
          <span class="dropdown-arrow">▾</span>
        </button>

        <div class="user-dropdown-menu" id="user-dropdown-menu">
          <div class="user-dropdown-search">
            <input type="text" id="user-search-input" placeholder="Search user..." oninput="filterUserList()">
          </div>
          <div class="user-dropdown-list" id="user-dropdown-list">
            <!-- Populated via /api/users -->
          </div>
          <div class="user-dropdown-footer">
            <button class="directory-view-btn" onclick="openDirectoryModal()">👥 Browse All DiscordRPC Users</button>
          </div>
        </div>
      </div>

      <button class="btn" onclick="fetchStats()">↻ Refresh</button>
      <button class="btn" id="auto-btn" onclick="toggleAuto()">Auto: 3s</button>
    </div>
  </header>

  <!-- Discord Broadcast Banner -->
  <div class="discord-banner">
    <div class="discord-now">
      <span class="discord-pill">Discord Live</span>
      <div>
        <div class="discord-details" id="discord-details">Connecting to Protutech RPC...</div>
        <div class="discord-meta" id="discord-state">Loading active rotation status...</div>
      </div>
    </div>
    <div class="discord-meta" id="rotation-counter" style="text-align: right; font-weight: 600;">
      6.0s Rotation
    </div>
  </div>

  <!-- All Mini Screens Grid -->
  <div class="grid" id="screens-grid">
    <!-- Populated dynamically via JavaScript -->
  </div>

  <footer class="footer">
    Protutech VE • DiscordRPC • Multi-User System Hub • Powered by Cloudflare & Discord IPC
  </footer>
</div>

<!-- Community Directory Modal -->
<div class="modal-overlay" id="directory-modal" onclick="closeDirectoryModalOnBg(event)">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">👥 DiscordRPC Member Directory</div>
      <button class="modal-close-btn" onclick="closeDirectoryModal()">✕</button>
    </div>
    <div class="user-dropdown-search" style="padding: 0 0 10px 0;">
      <input type="text" id="modal-search-input" placeholder="Filter members..." oninput="filterModalDirectory()">
    </div>
    <div class="directory-grid" id="modal-directory-grid">
      <!-- Populated via /api/users -->
    </div>
  </div>
</div>

<script>
  let autoRefresh = true;
  let timerId = null;
  let usersTimerId = null;
  let cachedUsers = [];
  let currentUserId = new URLSearchParams(window.location.search).get('user') || '';

  // Close dropdown when clicking outside
  document.addEventListener('click', (e) => {
    const wrapper = document.querySelector('.user-select-wrapper');
    if (wrapper && !wrapper.contains(e.target)) {
      document.getElementById('user-dropdown-menu').classList.remove('show');
    }
  });

  function toggleUserDropdown() {
    document.getElementById('user-dropdown-menu').classList.toggle('show');
  }

  function openDirectoryModal() {
    document.getElementById('user-dropdown-menu').classList.remove('show');
    document.getElementById('directory-modal').classList.add('show');
    renderModalDirectory(cachedUsers);
  }

  function closeDirectoryModal() {
    document.getElementById('directory-modal').classList.remove('show');
  }

  function closeDirectoryModalOnBg(e) {
    if (e.target.id === 'directory-modal') {
      closeDirectoryModal();
    }
  }

  function switchUser(uid) {
    currentUserId = uid;
    const url = new URL(window.location);
    url.searchParams.set('user', uid);
    window.history.pushState({}, '', url);

    document.getElementById('user-dropdown-menu').classList.remove('show');
    closeDirectoryModal();

    fetchStats();
    updateHeaderUserBadge();
  }

  async function fetchUsers() {
    try {
      const res = await fetch('/api/users');
      if (!res.ok) return;
      const data = await res.json();
      cachedUsers = data.users || [];

      if (!currentUserId && data.default_user) {
        currentUserId = data.default_user;
        const url = new URL(window.location);
        url.searchParams.set('user', currentUserId);
        window.history.replaceState({}, '', url);
      }

      renderUserDropdown(cachedUsers);
      updateHeaderUserBadge();
    } catch (e) {
      console.warn("Could not fetch user list:", e);
    }
  }

  function updateHeaderUserBadge() {
    const active = cachedUsers.find(u => u.id === currentUserId) || {
      name: currentUserId || 'Local User',
      avatar: 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png',
      online: true
    };
    document.getElementById('header-user-name').textContent = active.name;
    document.getElementById('header-user-avatar').src = active.avatar || 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png';
    const dot = document.getElementById('header-user-dot');
    dot.className = `status-dot-sm ${active.online ? 'online' : 'offline'}`;
  }

  function renderUserDropdown(users) {
    const list = document.getElementById('user-dropdown-list');
    list.innerHTML = '';

    if (users.length === 0) {
      list.innerHTML = '<div style="padding: 10px; font-size: 0.8rem; color: var(--text-muted); text-align: center;">No users registered</div>';
      return;
    }

    users.forEach(u => {
      const item = document.createElement('div');
      item.className = `user-item ${u.id === currentUserId ? 'active' : ''}`;
      item.onclick = () => switchUser(u.id);

      item.innerHTML = `
        <img src="${u.avatar || 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png'}" class="user-avatar-sm" onerror="this.src='https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png'">
        <div class="user-item-info">
          <div class="user-item-name">${u.name}</div>
          <div class="user-item-meta">${u.online ? '● Online' : '○ Offline'} • ${u.current_screen || (u.total_screens + ' screens')}</div>
        </div>
        <span class="status-dot-sm ${u.online ? 'online' : 'offline'}"></span>
      `;
      list.appendChild(item);
    });
  }

  function filterUserList() {
    const term = document.getElementById('user-search-input').value.toLowerCase();
    const filtered = cachedUsers.filter(u => u.name.toLowerCase().includes(term) || u.id.toLowerCase().includes(term));
    renderUserDropdown(filtered);
  }

  function renderModalDirectory(users) {
    const grid = document.getElementById('modal-directory-grid');
    grid.innerHTML = '';

    users.forEach(u => {
      const card = document.createElement('div');
      card.className = 'user-card-sm';
      card.onclick = () => switchUser(u.id);

      card.innerHTML = `
        <img src="${u.avatar || 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png'}" class="user-card-avatar" onerror="this.src='https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png'">
        <div style="font-weight: 700; font-size: 0.95rem;">${u.name}</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);">
          <span class="status-dot-sm ${u.online ? 'online' : 'offline'}" style="margin-right: 4px;"></span>
          ${u.online ? 'Online' : 'Offline'}
        </div>
        <div style="font-size: 0.72rem; color: var(--accent); margin-top: 4px;">View DiscordRPC →</div>
      `;
      grid.appendChild(card);
    });
  }

  function filterModalDirectory() {
    const term = document.getElementById('modal-search-input').value.toLowerCase();
    const filtered = cachedUsers.filter(u => u.name.toLowerCase().includes(term) || u.id.toLowerCase().includes(term));
    renderModalDirectory(filtered);
  }

  async function fetchStats() {
    try {
      const url = currentUserId ? `/api/stats?user=${encodeURIComponent(currentUserId)}` : '/api/stats';
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP error " + res.status);
      const data = await res.json();
      renderDashboard(data);
    } catch (e) {
      console.error("Failed to fetch live stats:", e);
    }
  }

  function renderDashboard(data) {
    const screens = data.screens || [];
    const currentName = data.current_screen_name || "";
    const activeIdx = data.screen_index !== undefined ? data.screen_index : 0;
    const userName = data.user_name || currentUserId || "User";

    // Update Discord live banner
    if (screens.length > 0) {
      const cur = screens.find(s => s.name === currentName) || screens[0];
      document.getElementById('discord-details').textContent = `${userName}: ${cur.details}`;
      document.getElementById('discord-state').textContent = cur.state;
      document.getElementById('rotation-counter').textContent = `Screen ${activeIdx + 1} of ${screens.length} • 6.0s`;
    } else {
      document.getElementById('discord-details').textContent = `${userName}: No active screens broadcasting`;
      document.getElementById('discord-state').textContent = "Offline or awaiting sync";
    }

    const grid = document.getElementById('screens-grid');
    grid.innerHTML = '';

    screens.forEach(s => {
      const isCurrent = (s.name === currentName);
      const card = document.createElement('div');
      card.className = `card ${isCurrent ? 'active-screen' : ''}`;

      let iconUrl = s.large_image || "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png";
      if (!iconUrl.startsWith("http://") && !iconUrl.startsWith("https://")) {
        iconUrl = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png";
      }

      let extraContent = '';

      // Screen-specific rich metric displays
      if (s.name === "Proxmox Overview" && s.stats) {
        const cpu = s.stats.cpu_pct || 0;
        const ram = s.stats.mem_pct || 0;
        const usedGb = (s.stats.storage_used_gb || 0).toFixed(0);
        const totalTb = (s.stats.storage_total_tb || 0).toFixed(1);
        const stPct = s.stats.storage_pct || 0;

        extraContent = `
          <div style="margin-top: 8px;">
            <div class="metric-row"><span>CPU Utilization</span><span>${cpu.toFixed(1)}%</span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${Math.min(100, cpu)}%;"></div></div>

            <div class="metric-row"><span>Memory Usage</span><span>${ram.toFixed(0)}%</span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${Math.min(100, ram)}%; background: linear-gradient(90deg, #5865f2, #9b59b6);"></div></div>

            <div class="metric-row"><span>Storage Pool (${s.stats.storage_pool || 'local-lvm'})</span><span>${usedGb}G / ${totalTb}TB</span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${Math.min(100, stPct)}%; background: linear-gradient(90deg, #f0b232, #f23f43);"></div></div>

            <div class="chips-group">
              <span class="chip green">● ${s.stats.running_vms || 0}/${s.stats.total_vms || 0} VMs</span>
              <span class="chip green">● ${s.stats.running_lxcs || 0}/${s.stats.total_lxcs || 0} LXCs</span>
              <span class="chip">Up: ${s.stats.uptime || '0m'}</span>
            </div>
          </div>
        `;
      } else if (s.name === "Crypto Miner" && s.k_stats) {
        const k = s.k_stats;
        extraContent = `
          <div class="chips-group" style="margin-top: 8px;">
            <span class="chip ${k.mining ? 'green' : ''}">${k.mining ? '● Mining Active' : '○ Standby'}</span>
            ${k.gpu ? `<span class="chip highlight">GPU: ${k.gpu.coin} (${k.gpu.hashrate})</span>` : ''}
            ${k.cpu ? `<span class="chip highlight">CPU: ${k.cpu.coin} (${k.cpu.hashrate})</span>` : ''}
          </div>
        `;
      } else if (s.name === "Network Speed" && s.net_stats) {
        const n = s.net_stats;
        extraContent = `
          <div class="chips-group" style="margin-top: 8px;">
            <span class="chip green">↓ ${n.down_mbps >= 1000 ? (n.down_mbps/1000).toFixed(2) + ' Gbps' : n.down_mbps + ' Mbps'} Down</span>
            <span class="chip highlight">↑ ${n.up_mbps >= 1000 ? (n.up_mbps/1000).toFixed(2) + ' Gbps' : n.up_mbps + ' Mbps'} Up</span>
            <span class="chip">⚡ ${n.ping_ms ? n.ping_ms.toFixed(1) + 'ms' : '2.2ms'} Ping</span>
          </div>
        `;
      } else if (s.name === "Steam Profile" && s.steam_data) {
        const st = s.steam_data;
        extraContent = `
          <div class="chips-group" style="margin-top: 8px;">
            <span class="chip green">🏆 ${st.achievements || 0} Achievements</span>
            <span class="chip highlight">🎖️ ${st.badges || 0} Badges</span>
            <span class="chip">⭐ Level ${st.level || 0}</span>
            <span class="chip">🎮 ${st.games || 0} Games</span>
            ${st.perfect_games && st.perfect_games !== '0' ? `<span class="chip highlight">👑 ${st.perfect_games} Perfect</span>` : ''}
            <span class="chip">🎒 ${st.items || 0} Items</span>
          </div>
        `;
      } else if (s.name === "GitHub Repositories" && s.github_stats) {
        const gh = s.github_stats;
        extraContent = `
          <div class="chips-group" style="margin-top: 8px;">
            <span class="chip green">${gh.total_repos || 0} Repositories</span>
            <span class="chip">Strict Privacy Safe</span>
          </div>
        `;
      } else if (s.name === "Free Games" && s.free_games_data) {
        const fg = s.free_games_data;
        const gamesList = fg.games || [];
        if (gamesList.length > 0) {
          extraContent = `
            <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px;">
              ${gamesList.map(g => {
                const worthHtml = (g.worth && g.worth !== "N/A" && g.worth !== "Free") ? `<span class="worth-strike">${g.worth}</span>` : '';
                const claimUrl = g.url || 'https://www.gamerpower.com';
                return `
                  <a href="${claimUrl}" target="_blank" rel="noopener noreferrer" class="free-game-item">
                    <div class="free-game-title">
                      <span>🎁</span>
                      <span title="${g.title}">${g.title}</span>
                    </div>
                    <div class="free-game-meta">
                      ${worthHtml}
                      <span class="platform-tag">${g.platform || 'PC'}</span>
                      <span class="free-badge">CLAIM FREE ↗</span>
                    </div>
                  </a>
                `;
              }).join('')}
              <div style="margin-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text-muted); padding: 0 2px;">
                <span>Verified via GamerPower API</span>
                <a href="https://www.gamerpower.com" target="_blank" rel="noopener noreferrer" style="color: var(--accent); text-decoration: none; font-weight: 600;">GamerPower.com ↗</a>
              </div>
            </div>
          `;
        } else {
          extraContent = `
            <div class="chips-group" style="margin-top: 8px;">
              <span class="chip">No active promos right now</span>
              <a href="https://www.gamerpower.com" target="_blank" rel="noopener noreferrer" class="chip highlight" style="text-decoration:none;">Check GamerPower ↗</a>
            </div>
          `;
        }
      }

      const subtitle = s.name === "Free Games" ? "GamerPower & Epic Tracker" : (s.screen_type || 'System Screen');

      card.innerHTML = `
        <div class="card-header">
          <img src="${iconUrl}" class="card-icon" onerror="this.src='https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png'">
          <div>
            <div class="card-title">${s.name}</div>
            <div class="card-subtitle">${subtitle}</div>
          </div>
        </div>
        <div class="card-body">
          <div class="primary-metric">${s.details}</div>
          <div class="secondary-state">${s.state}</div>
          ${extraContent}
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function toggleAuto() {
    autoRefresh = !autoRefresh;
    const btn = document.getElementById('auto-btn');
    if (autoRefresh) {
      btn.textContent = "Auto: 3s";
      btn.style.color = "var(--text)";
      startPolling();
    } else {
      btn.textContent = "Auto: OFF";
      btn.style.color = "var(--red)";
      clearInterval(timerId);
    }
  }

  function startPolling() {
    clearInterval(timerId);
    timerId = setInterval(fetchStats, 3000);
    clearInterval(usersTimerId);
    usersTimerId = setInterval(fetchUsers, 10000);
  }

  // Initial fetches
  fetchUsers().then(() => {
    fetchStats();
  });
  startPolling();
</script>
</body>
</html>
